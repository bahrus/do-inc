<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic shorthand forms</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <mood-stone itemscope>
        <span itemprop=age></span>
        <button id=stringForm>Increment by 1</button>
    </mood-stone>
    <mood-stone itemscope>
        <span itemprop=age></span>
        <button id=objectForm>Increment by 12</button>
    </mood-stone>
    <mood-stone itemscope>
        <span itemprop=age></span>
        <button id=mixedForm>Increment by 1 and by 100</button>
    </mood-stone>
    <script type=module>
        class MoodStone extends HTMLElement {
            #age;
            get age(){
                return this.#age;
            }
            set age(nv){
                this.#age = nv;
                this.querySelector('[itemprop="age"]').textContent = nv;
            }
        }
        customElements.define('mood-stone', MoodStone);
        for(const ms of document.querySelectorAll('mood-stone')) ms.age = 0;
    </script>
    <script type=module>
        import {defDoInc} from '/def.js';
        const emc = await defDoInc(document.body);
        // a property name -- equivalent to <button do-inc=age>
        stringForm.enh.get(emc).increments = 'age';
        // a single rule -- equivalent to <button do-inc="age byAmt `12`">
        objectForm.enh.get(emc).increments = {prop: 'age', byAmtN: 12};
        // an array mixing both -- two increments per click
        mixedForm.enh.get(emc).increments = ['age', {prop: 'age', byAmtN: 100}];
    </script>
</body>
</html>
