<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative in sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <mood-stone itemscope>
        <span itemprop=age></span>
        <button id=button>Increment</button>
    </mood-stone>
    <script type=module>
        class MoodStone extends HTMLElement {
            #age;
            get age(){
                return this.#age;
            }
            set age(nv){
                this.#age = nv;
                this.querySelector('[itemprop="age"]').textContent = nv;
            }
        }
        customElements.define('mood-stone', MoodStone);
        for(const ms of document.querySelectorAll('mood-stone')) ms.age = 0;
    </script>
    <script type=module>
        import {defDoInc} from '/def.js';
        await defDoInc(document.body);
        // equivalent to <button do-inc="age byAmt `12`">
        button.enh.set.doInc.increments = [{prop: 'age', byAmtN: 12}];
    </script>
</body>
</html>
