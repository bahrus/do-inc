<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>With Slash</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'xtal-element/index.js';
        import '/emc.js';
    </script>
</head>
<body>
    <mood-stone itemscope>
        <span itemprop=age></span>
        <button do-inc="age byAmt `12`">Increment</button>
        <xtal-element
            prop-defaults='{
                "age": 30
            }'
            xform='{
                "| age": 0
            }'
        ></xtal-element>
    </mood-stone>
    
</body>
</html>
