<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Shadow With Barebone Custom Element</title>
    <!-- #include virtual="/imports.html" -->

</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-grouped-capture-statements.js" 
                parser-name=parse-grouped-capture-statements></script>
        <script type=emc 
                src="do-inc/emc.json" 
                wait-for-parsers=parse-grouped-capture-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
        class MoodStone extends HTMLElement {
            #age;
            get age(){
                return this.#age;
            }
            set age(nv){
                this.#age = nv;
                this.querySelector('[itemprop="age"]').textContent = nv;
            }
        }
        customElements.define('mood-stone', MoodStone);
        document.querySelector('mood-stone').age = 0;
    </script>
    <mood-stone itemscope>
        <span itemprop=age></span>
        <button do-inc="age byAmt `12`">Increment</button>
    </mood-stone>
    <div id=target></div>
    <script>
        function runTest(){
            const ms = document.querySelector('mood-stone');
            ms.querySelector('button').click();
            setTimeout(() => {
                const age = ms.querySelector('[itemprop="age"]').textContent;
                if(age === '12'){
                    target.setAttribute('mark', 'good');
                }
            }, 500);
        }
        setTimeout(() => {
            runTest();
        }, 2000);
    </script>
</body>
</html>
