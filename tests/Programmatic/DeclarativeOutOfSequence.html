<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <mood-stone itemscope>
        <span itemprop=age></span>
        <button id=button name=age>Increment</button>
    </mood-stone>
    <div id=target></div>
    <script type=module>
        class MoodStone extends HTMLElement {
            #age;
            get age(){
                return this.#age;
            }
            set age(nv){
                this.#age = nv;
                this.querySelector('[itemprop="age"]').textContent = nv;
            }
        }
        customElements.define('mood-stone', MoodStone);
        for(const ms of document.querySelectorAll('mood-stone')) ms.age = 0;
    </script>
    <script type=module>
        import {defDoInc} from '/def.js';
        // set before the config is registered -- the spawn is deferred until defDoInc runs.
        // equivalent to <button name=age do-inc> -- everything inferred
        button.enh.set.doInc.increments = [];
        await defDoInc(document.body);

        setTimeout(() => {
            for(let i = 0; i < 1; i++) button.click();
            setTimeout(() => {
                const age = document.querySelector('[itemprop="age"]').textContent;
                if(age === '1') target.setAttribute('mark', 'good');
            }, 300);
        }, 1500);
    </script>
</body>
</html>
